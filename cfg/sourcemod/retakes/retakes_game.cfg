// Retakes game cvars for Counter-Strike: Source.
// The plugin executes this file on every map start and restores the previous values
// when it is disabled (sm_retakes_enabled 0) or unloaded.
// The format is strict: one "cvar value" per line, comments on their own lines only.

// --- Do not change: the mode depends on these ---
// the plugin manages the teams
mp_autoteambalance 0
mp_limitteams 0
// the match must not end on its own
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 0
mp_fraglimit 0
// no punishments or kicks from the game
mp_tkpunish 0
mp_autokick 0
mp_spawnprotectiontime 0
mp_hostagepenalty 0
// the plugin gives the weapons and zeroes the money; this is a safety net
mp_startmoney 800
mp_buytime 0.25
// the plugin sets the number of bots (sm_retakes_bots, sm_retakes_bots_total), only their behaviour is set here
bot_quota_mode normal
// 0 is required: the plugin itself keeps the "no humans - no bots" rule, and with 1 the bots
// would not join while the only human waits in the queue as a spectator
bot_join_after_player 0
bot_auto_vacate 1
bot_join_team any
bot_defer_to_human 0
bot_allow_rogues 0

// --- May be changed ---
mp_c4timer 40
mp_freezetime 4
mp_friendlyfire 0
mp_forcecamera 1
// in minutes; the actual time to plant the bomb is set by sm_retakes_round_time (in seconds)
mp_roundtime 2
sv_alltalk 0
bot_difficulty 2
bot_chatter minimal
