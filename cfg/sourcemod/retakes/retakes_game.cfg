// Игровые квары Retakes для Counter-Strike: Source.
// Плагин выполняет этот файл на старте каждой карты и возвращает прежние значения,
// когда выключается (sm_retakes_enabled 0) или выгружается.
// Формат строгий: одна строка - "квар значение", комментарии только отдельными строками.

// --- Не менять: от этого зависит работа режима ---
// командами управляет плагин
mp_autoteambalance 0
mp_limitteams 0
// матч не должен закончиться сам
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 0
mp_fraglimit 0
// никаких наказаний и киков от игры
mp_tkpunish 0
mp_autokick 0
mp_spawnprotectiontime 0
mp_hostagepenalty 0
// оружие выдаёт плагин, деньги он же обнуляет; это подстраховка
mp_startmoney 800
mp_buytime 0.25
// число ботов выставляет плагин (sm_retakes_bots, sm_retakes_bots_total), здесь только их поведение
bot_quota_mode normal
// 0 обязательно: "нет людей - нет ботов" плагин обеспечивает сам, а с 1 боты не зашли бы,
// пока единственный человек ждёт в очереди наблюдателем
bot_join_after_player 0
bot_auto_vacate 1
bot_join_team any
bot_defer_to_human 0
bot_allow_rogues 0

// --- Можно менять ---
mp_c4timer 40
mp_freezetime 4
mp_friendlyfire 0
mp_forcecamera 1
// в минутах; фактическое время на установку бомбы задаёт sm_retakes_round_time (в секундах)
mp_roundtime 2
sv_alltalk 0
bot_difficulty 2
bot_chatter minimal
